<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var tema = localStorage.getItem('cg_theme') || 'light';
        document.documentElement.setAttribute('data-tema', tema);
        document.documentElement.setAttribute('data-theme', tema);
      } catch (e) {}
    })();
  </script>
  <title>EcoBuck — Controle de Gastos Pessoais</title>
  <link rel="icon" type="image/x-icon" href="assets/brand/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/icones/icone-32.png">
  <link rel="apple-touch-icon" href="assets/brand/icones/icone-180.png">
  <meta http-equiv="refresh" content="0; url=pages/login.html">
</head>
<body>
  <script src="js/storage.js"></script>
  <script>
    // Se já existir sessão ativa, pula direto para a área correta
    const sessao = Storage.getSession();
    if (sessao) {
      const usuario = Storage.getCurrentUser();
      if (usuario) {
        window.location.replace(usuario.tipo === 'admin' ? 'pages/admin.html' : 'pages/dashboard.html');
      } else {
        window.location.replace('pages/login.html');
      }
    } else {
      window.location.replace('pages/login.html');
    }
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=pages/login.html">
  </noscript>
</body>
</html>
